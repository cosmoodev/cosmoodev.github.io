<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1000" width="1440" height="1000" role="img" aria-label="Терминал: запуск news-parser и сохранение статей в CSV">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d15"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.08" r="0.85">
      <stop offset="0" stop-color="#e6754c" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e6754c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="1000" fill="url(#bg)"/>
  <rect width="1440" height="1000" fill="url(#glow)"/>

  <rect x="110" y="140" width="1220" height="720" rx="22" fill="#0d0f17" stroke="#242833" stroke-width="2"/>
  <path d="M110 162a22 22 0 0 1 22-22h1176a22 22 0 0 1 22 22v38H110z" fill="#121520"/>
  <line x1="110" y1="200" x2="1330" y2="200" stroke="#242833" stroke-width="2"/>
  <circle cx="150" cy="171" r="8" fill="#ff5f57"/>
  <circle cx="180" cy="171" r="8" fill="#febc2e"/>
  <circle cx="210" cy="171" r="8" fill="#28c840"/>
  <text x="720" y="178" text-anchor="middle" fill="#7c7c87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">news-parser — python</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25">
    <text x="160" y="290" fill="#7c7c87">$</text>
    <text x="200" y="290" fill="#f2efe9">python news_parser.py -f habr.com/rss -n 10 -F csv</text>

    <text x="160" y="350" fill="#28c840">[ok]</text>
    <text x="235" y="350" fill="#a2a1ac">https://habr.com/ru/rss/news</text>

    <text x="160" y="400" fill="#28c840">[ok]</text>
    <text x="235" y="400" fill="#a2a1ac">https://lenta.ru/rss/news</text>

    <text x="160" y="452" fill="#e6754c">Saved 20 articles -&gt; output/news_20261109_1430.csv</text>
  </g>

  <rect x="150" y="500" width="1140" height="300" rx="14" fill="#121520" stroke="#242833" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">
    <text x="182" y="548" fill="#e6754c">title</text>
    <text x="905" y="548" fill="#e6754c">published</text>
    <text x="1150" y="548" fill="#e6754c">source</text>
    <line x1="170" y1="568" x2="1270" y2="568" stroke="#242833" stroke-width="2"/>

    <text x="182" y="612" fill="#f2efe9">«Яндекс Маркет» запустил продажи…</text>
    <text x="905" y="612" fill="#a2a1ac">2026-11-09</text>
    <text x="1150" y="612" fill="#a2a1ac">habr</text>

    <text x="182" y="662" fill="#f2efe9">VK Education запустил курс‑сериал…</text>
    <text x="905" y="662" fill="#a2a1ac">2026-11-09</text>
    <text x="1150" y="662" fill="#a2a1ac">habr</text>

    <text x="182" y="712" fill="#f2efe9">Россиянин замаскировал лабораторию…</text>
    <text x="905" y="712" fill="#a2a1ac">2026-11-09</text>
    <text x="1150" y="712" fill="#a2a1ac">lenta</text>

    <text x="182" y="762" fill="#7c7c87">… 17 more rows</text>
  </g>

  <rect x="160" y="838" width="14" height="26" rx="2" fill="#e6754c"/>
</svg>
