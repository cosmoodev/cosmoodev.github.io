<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#08090F" />
  <title>Страница не найдена — Алексей Меркулов</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <div id="space-bg" aria-hidden="true">
    <span class="shooting-star" style="top: 22%; left: 82%"></span>
  </div>

  <header id="site-header">
    <div class="container nav">
      <a href="/" class="logo" aria-label="Алексей Меркулов — на главную"><span>АМ</span><i>.</i></a>
      <a class="btn btn-ghost" href="/">На главную</a>
    </div>
  </header>

  <main id="main" class="not-found">
    <div class="container">
      <p class="eyebrow">Ошибка 404</p>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>Страница <em>потерялась</em>.</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там проекты и контакты.</p>
      <a class="btn btn-primary" href="/">На главную <span>→</span></a>
    </div>
  </main>
</body>
</html>
